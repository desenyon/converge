[workspace]
resolver = "3"
members = [
  "crates/converge-cli",
  "crates/converge-core",
  "crates/converge-model",
  "crates/converge-store",
  "crates/converge-discovery",
  "crates/converge-graph",
  "crates/converge-planner",
  "crates/converge-sandbox",
  "crates/converge-executor",
  "crates/converge-report",
  "crates/converge-telemetry",
  "crates/converge-mcp",
  "crates/converge-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/concatenate-ai/converge"
homepage = "https://github.com/concatenate-ai/converge"
description = "Local-first dependency intelligence and environment convergence"
publish = false

[workspace.dependencies]
atomic-write-file = "0.3.0"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
fs2 = "0.4.3"
miette = { version = "7.6.0", features = ["fancy"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
pep508_rs = "0.9.2"
rusqlite = { version = "0.40.1", features = ["bundled", "time", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.2"
toml_edit = "0.25.12"
tree-sitter = "0.26.10"
tree-sitter-python = "0.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }
walkdir = "2.5.0"
yaml-rust2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
